# Local stack: the API with a real Qdrant server. Offline embeddings by default;
# set ARAG_EMBEDDER=openai and the ARAG_EMBED_* / ARAG_LLM_* variables in .env to use a model.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  api:
    build: .
    depends_on: [qdrant]
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      ARAG_VECTOR_STORE: qdrant
      ARAG_QDRANT_URL: http://qdrant:6333

volumes:
  qdrant-data:
