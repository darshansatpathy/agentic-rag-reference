[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag-reference"
version = "0.1.0"
description = "Permission-aware agentic RAG: hybrid retrieval with RRF, re-ranking, cited answers, calibrated abstention, prompt-injection quarantine and an evaluation gate in CI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["rag", "retrieval", "llm", "agentic-ai", "bm25", "hybrid-search", "qdrant", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "snowballstemmer>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "qdrant-client>=1.9",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "pip-audit>=2.7",
]

[project.scripts]
arag = "agentic_rag.cli:main"

[project.urls]
Repository = "https://github.com/darshansatpathy/agentic-rag-reference"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.hatch.build.targets.wheel.force-include]
"data/corpus" = "agentic_rag/data/corpus"
"evals" = "agentic_rag/evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["qdrant: needs qdrant-client (runs Qdrant in-process, no server)"]
filterwarnings = ["error::ResourceWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["agentic_rag"]
omit = ["*/agentic_rag/cli.py:cmd_serve"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agentic_rag"]

[[tool.mypy.overrides]]
module = ["snowballstemmer", "qdrant_client.*"]
ignore_missing_imports = true
