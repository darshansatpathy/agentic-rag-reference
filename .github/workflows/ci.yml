name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Corpus is reproducible from its generator
        run: |
          python scripts/generate_corpus.py
          git diff --exit-code -- data/corpus
      - name: Tests with coverage (includes Qdrant in-process)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Evaluation gate (retrieval, answers, permissions, injection)
        run: arag eval --check --report eval-report.md
      - name: Offline demo runs end to end
        run: arag demo

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[qdrant,otel]" pip-audit
      - name: pip-audit (known vulnerabilities in installed dependencies)
        run: pip-audit --skip-editable

  docker:
    name: Container builds and answers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t agentic-rag-reference:ci .
      - name: Health check, a cited answer and a permission check
        run: |
          docker run -d --name arag -p 8080:8080 -e ARAG_SERVICE_TOKEN=ci-token agentic-rag-reference:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          ask() {
            curl -fsS localhost:8080/v1/ask -H "Authorization: Bearer ci-token" \
              -H 'content-type: application/json' -H "X-User-Groups: $1" -d "{\"question\": \"$2\"}"
          }
          OUT=$(ask "" "How long is warehouse CCTV footage kept?")
          echo "$OUT"; echo "$OUT" | grep -q '30 days'
          OUT=$(ask "" "What is the salary range for band E4?")
          echo "$OUT"; echo "$OUT" | grep -q '"abstained":true'
          OUT=$(ask "hr" "What is the salary range for band E4?")
          echo "$OUT"; echo "$OUT" | grep -q '88,000'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/ask -H 'content-type: application/json' -d '{"question":"x"}')" = 401
      - name: Container logs
        if: always()
        run: docker logs arag || true
